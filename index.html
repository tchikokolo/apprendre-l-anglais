<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Facile : apprends l'anglais pas à pas</title>

  <link rel="stylesheet" href="style.css">

  <!-- Application installable -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F6B45">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English Facile">
</head>
<body>

  <header class="entete">
    <a href="#/" class="logo">🇬🇧 English Facile</a>
    <nav>
      <a href="#/">Programme</a>
      <button id="btn-installer" style="display:none; background:#F5B400; color:#3a2a00; font-size:14px; padding:8px 12px; margin:0 0 0 10px; box-shadow:none;">📲 Installer</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="pied-site">
    <p>English Facile · Apprendre l'anglais à ton rythme 💙</p>
  </footer>

  <!-- Les cours (un fichier par période) -->
  <script src="data/semaines-01-04.js"></script>

  <!-- Le moteur du site -->
  <script src="app.js"></script>

  <!-- Installation comme application -->
  <script>
    // Mode hors-ligne
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    // Bouton « Installer »
    var promptInstall = null;
    var bouton = document.getElementById("btn-installer");
    var estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var dejaInstallee = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      promptInstall = e;
      if (!dejaInstallee) bouton.style.display = "inline-block";
    });

    if (estIOS && !dejaInstallee) bouton.style.display = "inline-block";

    bouton.onclick = function () {
      if (promptInstall) {
        promptInstall.prompt();
        promptInstall.userChoice.then(function () {
          promptInstall = null;
          bouton.style.display = "none";
        });
      } else {
        alert("Sur iPhone : appuie sur le bouton Partager (le carré avec une flèche), puis sur « Sur l'écran d'accueil ».");
      }
    };

    window.addEventListener("appinstalled", function () {
      bouton.style.display = "none";
    });
  </script>
</body>
</html>
